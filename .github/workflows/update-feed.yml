name: Publish signed update feeds
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: msgzle-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Read public release feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          mkdir -p updates incoming
          gh release download "$RELEASE_TAG" --pattern 'appcast-*.xml' --dir incoming
          python3 - <<'PYXML'
          import os, pathlib, xml.etree.ElementTree as ET
          ns={'s':'http://www.andymatuschak.org/xml-namespaces/sparkle'}
          for arch in ['x64','arm64']:
            p=pathlib.Path('incoming')/f'appcast-{arch}.xml'
            root=ET.parse(p).getroot();item=root.find('channel/item');e=item.find('enclosure')
            assert item.find('s:shortVersionString',ns).text==os.environ['RELEASE_TAG'][1:]
            assert e.attrib['url']==f"https://github.com/{os.environ['RELEASE_REPO']}/releases/download/{os.environ['RELEASE_TAG']}/Msgzle-{arch}.zip"
            assert e.attrib['{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature']
            current=pathlib.Path('updates')/p.name
            if current.exists():
              old=ET.parse(current).getroot().find('channel/item/s:version',ns).text
              assert int(item.find('s:version',ns).text)>=int(old), 'Refusing older update feed'
            current.write_bytes(p.read_bytes())
          PYXML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates
          if ! git diff --cached --quiet; then
            git commit -m "Update signed appcasts for $RELEASE_TAG"
            git push origin main
          fi
